services:
  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./data:/srv/app/data", "./artifacts:/srv/app/artifacts"]
  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    env_file: .env
    volumes: ["./data:/srv/app/data", "./artifacts:/srv/app/artifacts"]
    depends_on: [api]
