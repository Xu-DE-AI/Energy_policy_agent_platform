[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-policy-agent-platform"
version = "1.0.0"
description = "Auditable energy-policy AI agent with RAG, tool tracing, cost accounting, and analytics dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "streamlit>=1.38", "pandas>=2.2",
  "numpy>=1.26", "plotly>=5.24", "pydantic>=2.8", "pydantic-settings>=2.5", "python-dotenv>=1.0",
  "scikit-learn>=1.5", "httpx>=0.27", "sqlalchemy>=2.0", "structlog>=24.4",
  "openai>=1.50", "tenacity>=9.0", "pytest>=8.3", "ruff>=0.6"
]

[project.optional-dependencies]
pipeline = ["prefect>=3.0"]
vector = ["chromadb>=0.5", "sentence-transformers>=3.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
